<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#263a35">
  <title>Vila Entrelinhas</title>
  <link rel="icon" href="assets/selo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="style-art.css">
  <script defer src="js/data.js"></script>
  <script defer src="js/state.js"></script>
  <script defer src="js/world.js"></script>
  <script defer src="js/ui.js"></script>
  <script defer src="js/main.js"></script>
</head>
<body>
  <main class="game-shell" aria-label="Vila Entrelinhas">
    <section class="play-area" aria-label="Cena da investigação">
      <canvas id="world" width="1000" height="620" aria-label="Vila vista de cima. Use WASD ou as setas para andar e E para investigar."></canvas>
      <div class="scene-wash" aria-hidden="true"></div>
      <header class="topbar">
        <a class="wordmark" href="#inicio" aria-label="Vila Entrelinhas, início">
          <span class="seal-mark" aria-hidden="true">V</span>
          <span>Vila <i>Entrelinhas</i></span>
        </a>
        <div class="weather"><span class="rain-mark" aria-hidden="true">☂</span><span>Noite do festival</span><span class="weather-divider"></span><span id="clock">21:42</span></div>
        <button class="icon-button sound-toggle" id="sound-toggle" title="Som ambiente" aria-label="Ativar ou desativar som">♫</button>
      </header>
      <div class="location-label"><span class="location-pin" aria-hidden="true"></span><div><small>AGORA, EM</small><strong id="location-name">Praça do Festival</strong></div></div>
      <div class="objective-strip"><span class="objective-star" aria-hidden="true">✳</span><span id="objective">Encontre alguém que tenha visto Lia depois do apagão.</span></div>
      <div class="interaction-prompt" id="interaction-prompt" hidden><kbd>E</kbd><span id="interaction-label">Examinar</span></div>
      <div class="travel-hint"><kbd>W A S D</kbd><span>ou setas para andar</span></div>
      <nav class="tool-rail" aria-label="Ferramentas">
        <button class="tool-button active" data-panel="notebook"><span class="tool-glyph">✎</span><span>Caderno</span></button>
        <button class="tool-button" data-panel="evidence"><span class="tool-glyph">⌕</span><span>Pasta <b id="evidence-count">0</b></span></button>
        <button class="tool-button" data-panel="map"><span class="tool-glyph">⌖</span><span>Mapa</span></button>
        <button class="tool-button" data-panel="board"><span class="tool-glyph">⌘</span><span>Mural <b id="connection-count">0</b></span></button>
      </nav>
      <div class="rain-layer" aria-hidden="true"></div>
    </section>
    <aside class="side-panel" id="side-panel">
      <div class="panel-head"><div><small id="panel-eyebrow">ANOTAÇÕES DE CAMPO · 01</small><h1 id="panel-title">Caderno</h1></div><button class="icon-button quiet" id="panel-close" title="Fechar painel" aria-label="Fechar painel">×</button></div>
      <div class="panel-content" id="panel-content"></div>
      <footer class="panel-foot"><span><span class="save-dot"></span><span id="save-status">Caderno em branco</span></span><button class="text-button" id="settings-open">Ajustes</button></footer>
    </aside>
  </main>
  <div class="overlay" id="overlay" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <noscript>Este jogo precisa de JavaScript ativado para funcionar.</noscript>
</body>
</html>
